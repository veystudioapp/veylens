<svg viewBox="6 5.5 88 88.5" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  The app's mark: a lens held over data — bars rising toward it from either
  side, and inside the glass the one point it is looking at. Symmetric, and
  drawn in the family's register (Vey's lane switch, Vey Motion's diamond and
  speed lines): the bars are Vey's 13-unit stroke cut square, the lens is a
  ring with a solid point set in it, and the bars stop short of the ring
  where it passes over them.

  One colour — black here; resources/logo.svg draws it in white on the plate,
  path for path. The box is the ink's measured bounds.
-->
<defs>
  <mask id="lens-gap">
    <rect x="0" y="0" width="100" height="100" fill="#FFFFFF"/>
    <circle cx="50" cy="38" r="36" fill="#000000"/>
  </mask>
</defs>
<g fill="#000000" mask="url(#lens-gap)">
  <path d="M6 74H19V94H6Z"/>
  <path d="M25 58H38V94H25Z"/>
  <path d="M62 58H75V94H62Z"/>
  <path d="M81 74H94V94H81Z"/>
</g>
<circle cx="50" cy="38" r="11" fill="#000000"/>
<circle cx="50" cy="38" r="27" stroke="#000000" stroke-width="11"/>
</svg>
