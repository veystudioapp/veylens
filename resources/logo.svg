<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  The app's icon: resources/mark.svg in white on Vey's black plate (rx 22.5,
  a 30% grey hairline rim so it keeps an edge on a dark Dock). Same transform
  as Vey's icon — the mark's 88-unit width scaled to 72, centred — so the
  three apps stand the same optical size side by side.

  The one source for every logo the app ships: scripts/app-icon.mjs renders
  resources/icon.png from it, and src/renderer/public/favicon.svg is a copy.
-->
<rect width="100" height="100" rx="22.5" fill="#000000"/>
<g transform="translate(9.09 9.09) scale(0.8182)">
  <path d="M36 36H64V64H36Z" fill="#FFFFFF"/>
  <g stroke="#FFFFFF" stroke-width="13">
    <path d="M6 23H94"/>
    <path d="M6 77H94"/>
    <path d="M6 50H26"/>
    <path d="M74 50H94"/>
  </g>
</g>
<rect x="0.5" y="0.5" width="99" height="99" rx="22" stroke="#808080" stroke-opacity="0.3"/>
</svg>
