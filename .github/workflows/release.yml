name: Release

# A release is a tag: `git tag v0.1.0 && git push --tags`. Running it by hand
# builds the same installers as run artifacts without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos
            target: --mac
          - os: ubuntu-latest
            name: linux
            target: --linux
          - os: windows-latest
            name: windows
            target: --win
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # package.json's version names every artifact; a mismatched tag would
      # publish v0.2.0 containing Vey-Lens-0.1.0-arm64.dmg.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # The Google OAuth client built in for "Sign in with Google"; unset, the
      # app asks for the client's JSON instead.
      - run: bun run build
        env:
          VEYLENS_GOOGLE_CLIENT_ID: ${{ secrets.VEYLENS_GOOGLE_CLIENT_ID }}
          VEYLENS_GOOGLE_CLIENT_SECRET: ${{ secrets.VEYLENS_GOOGLE_CLIENT_SECRET }}

      # DuckDB's native binding is a package per platform, and bun installs
      # only this runner's (arm64). The x64 app needs the x64 one beside it.
      - name: Add DuckDB's x64 binding
        if: matrix.name == 'macos'
        shell: bash
        run: |
          version=$(node -p "require('./node_modules/@duckdb/node-bindings/package.json').version")
          npm pack "@duckdb/node-bindings-darwin-x64@$version" --pack-destination "$RUNNER_TEMP"
          mkdir -p node_modules/@duckdb/node-bindings-darwin-x64
          tar -xzf "$RUNNER_TEMP"/duckdb-node-bindings-darwin-x64-*.tgz \
            -C node_modules/@duckdb/node-bindings-darwin-x64 --strip-components=1
          ls -l node_modules/@duckdb/

      # Imported into our own keychain rather than via CSC_LINK: electron-builder's
      # throwaway keychain fails on the runner at set-key-partition-list.
      # Without the secret the job builds unsigned (fine for forks and manual
      # runs), but a tag on this repository fails instead of shipping a build
      # macOS reports as "damaged".
      - name: Import the Developer ID certificate
        if: matrix.name == 'macos'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PUBLISHING: ${{ startsWith(github.ref, 'refs/tags/v') && github.repository == 'veystudioapp/veylens' }}
        run: |
          if [ "$PUBLISHING" = "true" ]; then
            for name in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_ID \
              APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
              if [ -z "${!name}" ]; then
                echo "::error::secret $name is not set on $GITHUB_REPOSITORY — a release would ship unsigned or unnotarized"
                missing=1
              fi
            done
            [ -z "${missing:-}" ] || exit 1
          fi
          [ -n "$MAC_CSC_LINK" ] || exit 0
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MAC_CSC_KEY_PASSWORD" -f pkcs12 -A -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"
          echo "MAC_SIGNING=true" >> "$GITHUB_ENV"

      - name: Build installers
        # macOS is signed with the identity imported above and notarized with
        # an Apple ID + app-specific password. Windows and Linux stay unsigned.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.MAC_SIGNING == 'true' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          # The macOS zips and latest-mac.yml are the in-app update's feed
          # (src/main/electron-updates.ts); the dmgs are for a first install.
          # No blockmaps: the update downloads whole files.
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
            release/*.AppImage
            release/*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      # Notes are the commit subjects since the previous tag, minus the bare
      # version-bump commit.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh installers
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          range="${prev:+$prev..}$GITHUB_REF_NAME"
          git log --no-merges --format='%s' "$range" \
            | grep -Ev '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
            | sed -E 's/^/- /' > notes.md || true
          [ -s notes.md ] || echo "Maintenance release." > notes.md
          cat notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Vey Lens ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            installers/*
