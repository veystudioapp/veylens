<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  The app's icon: resources/mark.svg in white on Vey's black plate (rx 22.5,
  a 30% grey hairline rim so it keeps an edge on a dark Dock). The transform
  scales the mark's 88.5-unit ink to 66, centred: a mark as tall as it is
  wide fills more of the plate than Vey's, so it is drawn smaller to stand
  the same optical size beside it.

  The one source for every logo the app ships: scripts/app-icon.mjs renders
  resources/icon.png from it, and src/renderer/public/favicon.svg is a copy.
-->
<defs>
  <mask id="lens-gap">
    <rect x="0" y="0" width="100" height="100" fill="#FFFFFF"/>
    <circle cx="50" cy="38" r="36" fill="#000000"/>
  </mask>
</defs>
<rect width="100" height="100" rx="22.5" fill="#000000"/>
<g transform="translate(12.71 12.90) scale(0.7458)">
  <g fill="#FFFFFF" mask="url(#lens-gap)">
    <path d="M6 74H19V94H6Z"/>
    <path d="M25 58H38V94H25Z"/>
    <path d="M62 58H75V94H62Z"/>
    <path d="M81 74H94V94H81Z"/>
  </g>
  <circle cx="50" cy="38" r="11" fill="#FFFFFF"/>
  <circle cx="50" cy="38" r="27" stroke="#FFFFFF" stroke-width="11"/>
</g>
<rect x="0.5" y="0.5" width="99" height="99" rx="22" stroke="#808080" stroke-opacity="0.3"/>
</svg>
